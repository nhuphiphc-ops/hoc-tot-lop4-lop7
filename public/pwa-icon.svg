    <circle cx="256" cy="230" r="140" fill="#FFFBEB" />
    <text x="256" y="275" font-size="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">🐘</text>
    <rect x="80" y="380" width="352" height="64" rx="32" fill="#FFFFFF" />
    <text x="256" y="424" font-size="32" font-weight="900" text-anchor="middle" fill="#B45309" font-family="'Nunito', system-ui, sans-serif">HỌC TỐT 4 - 7</text>
